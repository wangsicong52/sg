<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>循环倒计时 持续预警提醒</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, "Microsoft Yahei", sans-serif;
}
body{
    background:#0c0c0c;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
#timeBox{
    font-size:76px;
    font-weight:bold;
    color:#ff5050;
    margin:40px 0;
}
.row{
    margin:14px 0;
}
input{
    font-size:19px;
    padding:9px 14px;
    width:460px;
    border-radius:6px;
    border:none;
}
button{
    padding:11px 26px;
    font-size:18px;
    margin:0 8px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    background:#ff4747;
    color:#fff;
}
button:hover{
    opacity:0.88;
}
.tip-text{
    margin-top:24px;
    color:#aaa;
}
</style>
</head>
<body>
<div class="row">
一轮倒计时总秒数：<input id="totalSec" value="20" placeholder="示例 20">
</div>
<div class="row">
提前预警秒数：<input id="warnSec" value="0.2" placeholder="支持小数 0.2">
</div>

<div id="timeBox">00.000 秒</div>

<div>
<button onclick="startTimer()">开始循环</button>
<button onclick="pauseTimer()">暂停</button>
<button onclick="resetTimer()">重置</button>
</div>
<div class="tip-text">点击【开始循环】启动；剩余0.2秒持续响铃，倒计时归零自动重启新一轮</div>

<script>
let timer = null;
let audioCtx = null;
let alarmLoop = null;
let currentLeft = 0;
let warned = false;

// 初始化音频环境
function initAudio(){
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// 蜂鸣音效
function beep(){
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 900;
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
}

function startAlarm(){
    stopAlarm();
    alarmLoop = setInterval(()=>beep(), 320);
}
function stopAlarm(){
    if(alarmLoop){
        clearInterval(alarmLoop);
        alarmLoop = null;
    }
}

function update(){
    const total = parseFloat(document.getElementById('totalSec').value);
    const warnVal = parseFloat(document.getElementById('warnSec').value);

    currentLeft -= 0.05;
    if(currentLeft <= 0){
        currentLeft = total;
        warned = false;
        stopAlarm();
    }

    document.getElementById('timeBox').innerText = currentLeft.toFixed(3) + " 秒";

    if(warnVal > 0 && currentLeft <= warnVal && !warned){
        warned = true;
        startAlarm();
    }
}

function startTimer(){
    initAudio(); // 点击按钮时初始化音频，绕过浏览器限制
    pauseTimer();
    const total = parseFloat(document.getElementById('totalSec').value);
    currentLeft = total;
    warned = false;
    stopAlarm();
    timer = setInterval(update, 50);
}

function pauseTimer(){
    if(timer){
        clearInterval(timer);
        timer = null;
    }
}

function resetTimer(){
    pauseTimer();
    stopAlarm();
    const total = parseFloat(document.getElementById('totalSec').value);
    currentLeft = total;
    warned = false;
    document.getElementById('timeBox').innerText = currentLeft.toFixed(3) + " 秒";
}
</script>
</body>
</html>
