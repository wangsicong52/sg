<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>倒计时-可重复提醒</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft Yahei", sans-serif;
}
body{
    background:#0c0c0c;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
#timeBox{
    font-size:72px;
    font-weight:bold;
    color:#ff5050;
    margin:40px 0;
}
.row{
    margin:14px 0;
}
input{
    font-size:19px;
    padding:9px 14px;
    width:460px;
    border-radius:6px;
    border:none;
}
button{
    padding:11px 26px;
    font-size:18px;
    margin:0 8px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    background:#ff4747;
    color:#fff;
}
button:hover{
    opacity:0.88;
}
.tip-text{
    margin-top:24px;
    color:#aaa;
}
</style>
</head>
<body>
<div class="row">
目标时间：<input id="targetTime" placeholder="格式：2026-08-01 18:00:00">
</div>
<div class="row">
提前提醒秒数：<input id="warnSec" value="60" placeholder="剩余多少秒提醒">
</div>

<div id="timeBox">00天 00时 00分 00秒</div>

<div>
<button onclick="startTimer()">开始倒计时</button>
<button onclick="pauseTimer()">暂停</button>
<button onclick="resetTimer()">重置</button>
</div>
<div class="tip-text">重置后再次启动，提醒可以重复触发</div>

<script>
let timer = null;
let warned = false;

// 简易蜂鸣函数
function playBeep(){
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    oscillator.connect(gain);
    gain.connect(audioCtx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.value = 800;
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.3);
}

function update(){
    const targetStr = document.getElementById('targetTime').value;
    const warnNum = Number(document.getElementById('warnSec').value);
    const targetStamp = new Date(targetStr).getTime();
    const now = Date.now();
    const diff = targetStamp - now;

    if(diff <= 0){
        document.getElementById('timeBox').innerText = "倒计时结束！";
        clearInterval(timer);
        return;
    }

    let d = Math.floor(diff / 86400000);
    let h = Math.floor((diff % 86400000) / 3600000);
    let m = Math.floor((diff % 3600000) / 60000);
    let s = Math.floor((diff % 60000) / 1000);
    document.getElementById('timeBox').innerText = `${d}天 ${h}时 ${m}分 ${s}秒`;

    // 到达预警时间触发提醒
    if(warnNum > 0 && diff <= warnNum * 1000 && !warned){
        playBeep();
        alert("倒计时即将到达！");
        warned = true;
    }
}

function startTimer(){
    pauseTimer();
    update();
    timer = setInterval(update, 1000);
}

function pauseTimer(){
    if(timer){
        clearInterval(timer);
        timer = null;
    }
}

function resetTimer(){
    pauseTimer();
    warned = false;
    document.getElementById('timeBox').innerText = "00天 00时 00分 00秒";
}
</script>
</body>
</html>
