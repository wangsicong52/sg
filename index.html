<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义精准循环定时器</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.05s linear;
      background-color: #f5f5f7;
    }

    body.alert {
      background-color: #ff3b30;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      min-width: 320px;
    }

    h1 {
      margin-top: 0;
      color: #333;
      font-size: 1.5rem;
      margin-bottom: 24px;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #444;
    }

    .setting-row input {
      width: 70px;
      padding: 6px 8px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      font-weight: 500;
    }

    .setting-row input:focus {
      outline: none;
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }

    .setting-row input:disabled {
      background-color: #e5e5ea;
      color: #8e8e93;
    }

    .status {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 24px;
      min-height: 28px;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }

    #startBtn {
      background-color: #34c759;
      color: white;
    }

    #startBtn:hover:not(:disabled) {
      background-color: #28a745;
    }

    #stopBtn {
      background-color: #ff3b30;
      color: white;
    }

    #stopBtn:hover:not(:disabled) {
      background-color: #dc3545;
    }

    button:disabled {
      background-color: #e5e5ea;
      color: #8e8e93;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div class="container">
    <h1>自定义精准循环</h1>
    <div class="settings">
      <div class="setting-row">
        <span>循环总时长 (秒)</span>
        <input type="number" id="cycleInput" value="21.0" step="0.1" min="1">
      </div>
      <div class="setting-row">
        <span>提醒触发点 (秒)</span>
        <input type="number" id="offsetInput" value="20.8" step="0.1" min="0">
      </div>
    </div>
    <div class="status" id="status">点击“开启”开始定时</div>
    <div class="btn-group">
      <button id="startBtn">开启</button>
      <button id="stopBtn" disabled>停止</button>
    </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusText = document.getElementById('status');
const cycleInput = document.getElementById('cycleInput');
const offsetInput = document.getElementById('offsetInput');

let audioCtx = null;
let animFrameId = null;
let scheduleInterval = null;
let audioStartTime = 0;
let nextBeepIndex = 0;

let CYCLE_TIME = 21.0;
let BEEP_OFFSET = 20.8;
const ALERT_DURATION = 1.2;
const SCHEDULE_AHEAD = 3.0;

function scheduleBeep(targetAudioTime) {
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.type = 'sine';
  oscillator.frequency.value = 880;
  gainNode.gain.setValueAtTime(0, targetAudioTime);
  gainNode.gain.setValueAtTime(0.3, targetAudioTime + 0.005);
  gainNode.gain.setValueAtTime(0, targetAudioTime + 0.5);
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.start(targetAudioTime);
  oscillator.stop(targetAudioTime + 0.6);
}

function checkAudioSchedule() {
  if (!audioCtx) return;
  const elapsed = audioCtx.currentTime - audioStartTime;
  const nextBeepTime = (nextBeepIndex * CYCLE_TIME) + BEEP_OFFSET;
  if (elapsed + SCHEDULE_AHEAD >= nextBeepTime) {
    scheduleBeep(audioStartTime + nextBeepTime);
    nextBeepIndex++;
  }
}

function render() {
  if (!audioCtx) return;
  const elapsed = audioCtx.currentTime - audioStartTime;
  let remaining = BEEP_OFFSET - (elapsed % CYCLE_TIME);
  if (remaining < 0) remaining += CYCLE_TIME;
  statusText.innerText = 距离下一次提醒：${remaining.toFixed(1)} 秒;
  let timeSinceBeep = (elapsed - BEEP_OFFSET) % CYCLE_TIME;
  if (timeSinceBeep < 0) timeSinceBeep += CYCLE_TIME;
  if (elapsed >= BEEP_OFFSET && timeSinceBeep < ALERT_DURATION) {
    document.body.classList.add('alert');
  } else {
    document.body.classList.remove('alert');
  }
  animFrameId = requestAnimationFrame(render);
}

// 唯一入口：点击开启按钮才验证密码+初始化音频
startBtn.onclick = function(){
  const pwd = prompt('请输入密码');
  // 固定密码
  if(pwd !== 'qqsgsnt'){
    statusText.textContent = '密码错误，无法启动';
    return;
  }

  CYCLE_TIME = Number(cycleInput.value) || 21;
  BEEP_OFFSET = Number(offsetInput.value) || 20.8;
  if(BEEP_OFFSET >= CYCLE_TIME){
    BEEP_OFFSET = CYCLE_TIME - 0.2;
    offsetInput.value = BEEP_OFFSET;
  }

  startBtn.disabled = true;
  stopBtn.disabled = false;
  cycleInput.disabled = true;
  offsetInput.disabled = true;

  // 用户主动点击内创建音频，浏览器绝对放行
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();

  audioStartTime = audioCtx.currentTime;
  nextBeepIndex = 0;
  scheduleInterval = setInterval(checkAudioSchedule, 100);
  render();
}

stopBtn.onclick = function(){
  startBtn.disabled = false;
  stopBtn.disabled = true;
  cycleInput.disabled = false;
  offsetInput.disabled = false;

  cancelAnimationFrame(animFrameId);
  clearInterval(scheduleInterval);
  if(audioCtx){
    audioCtx.close();
    audioCtx = null;
  }
  document.body.classList.remove('alert');
  statusText.textContent = '循环已停止，可修改设置后重新开启';
}
</script>
</body>
</html>
