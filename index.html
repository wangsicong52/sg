<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>循环倒计时 小数提前预警</title>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, "Microsoft Yahei", sans-serif;
}
body{
    background:#0c0c0c;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}
#timeBox{
    font-size:76px;
    font-weight:bold;
    color:#ff5050;
    margin:40px 0;
}
.row{
    margin:14px 0;
}
input{
    font-size:19px;
    padding:9px 14px;
    width:460px;
    border-radius:6px;
    border:none;
}
button{
    padding:11px 26px;
    font-size:18px;
    margin:0 8px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    background:#ff4747;
    color:#fff;
}
button:hover{opacity:0.88;}
.tip-text{margin-top:24px;color:#aaa;}
</style>
</head>
<body>
<div class="row">一轮总秒数：<input id="totalSec" value="20"></div>
<div class="row">提前预警秒数：<input id="warnSec" value="0.2"></div>
<div id="timeBox">20.000 秒</div>
<div>
<button onclick="startTimer()">开始循环</button>
<button onclick="pauseTimer()">暂停</button>
<button onclick="resetTimer()">重置</button>
</div>
<div class="tip-text">点击开始解锁声音；剩余0.2秒持续响铃，归零自动重启</div>
<script>
let timer = null,audioCtx=null,alarm=null,left=0,warned=false;
// 初始化音频
function initAudio(){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
}
// 单次蜂鸣
function beep(){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type='sine';o.frequency.value=900;
    o.start();o.stop(audioCtx.currentTime+0.2);
}
// 持续警报
function startAlarm(){stopAlarm();alarm=setInterval(beep,300);}
function stopAlarm(){if(alarm){clearInterval(alarm);alarm=null;}}
function update(){
    const total=parseFloat(document.getElementById('totalSec').value);
    const w=parseFloat(document.getElementById('warnSec').value);
    left-=0.05;
    if(left<=0){left=total;warned=false;stopAlarm();}
    document.getElementById('timeBox').innerText=left.toFixed(3)+" 秒";
    if(w>0&&left<=w&&!warned){warned=true;startAlarm();}
}
function startTimer(){
    initAudio();pauseTimer();
    const t=parseFloat(document.getElementById('totalSec').value);
    left=t;warned=false;stopAlarm();
    timer=setInterval(update,50);
}
function pauseTimer(){if(timer){clearInterval(timer);timer=null;}}
function resetTimer(){
    pauseTimer();stopAlarm();
    const t=parseFloat(document.getElementById('totalSec').value);
    left=t;warned=false;
    document.getElementById('timeBox').innerText=left.toFixed(3)+" 秒";
}
</script>
</body>
</html>
