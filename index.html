
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义毫秒精准循环定时器</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.05s linear; 
      background-color: #f5f5f7;
    }

    body.alert {
      background-color: #ff3b30;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      min-width: 360px;
    }

    h1 {
      margin-top: 0;
      color: #333;
      font-size: 1.5rem;
      margin-bottom: 24px;
    }

    .settings {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #444;
      gap: 10px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .setting-row input {
      width: 65px;
      padding: 6px 4px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .setting-row input:focus {
      outline: none;
      border-color: #007aff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    }

    .setting-row input:disabled {
      background-color: #e5e5ea;
      color: #8e8e93;
      cursor: not-allowed;
    }

    /* 表格下方注释与蓝字提醒样式 */
    .note-section {
      text-align: left;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .blue-tip {
      color: #007aff;
      margin-top: 6px;
    }

    .status {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 24px;
      min-height: 28px;
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #startBtn {
      background-color: #34c759;
      color: white;
    }

    #startBtn:hover:not(:disabled) {
      background-color: #28a745;
      transform: scale(1.03);
    }

    #stopBtn {
      background-color: #ff3b30;
      color: white;
    }

    #stopBtn:hover:not(:disabled) {
      background-color: #dc3545;
      transform: scale(1.03);
    }

    button:disabled {
      background-color: #e5e5ea;
      color: #8e8e93;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>自定义毫秒精准循环</h1>
    
    <!-- UI 设置面板：默认值更新为 21秒112毫秒 和 20秒712毫秒 -->
    <div class="settings">
      <div class="setting-row">
        <span>循环总时长</span>
        <div class="input-wrapper">
          <input type="number" id="cycleSecInput" value="21" min="0">秒
          <input type="number" id="cycleMsInput" value="112" min="0" max="999">毫秒
        </div>
      </div>
      <div class="setting-row">
        <span>提醒触发点</span>
        <div class="input-wrapper">
          <input type="number" id="offsetSecInput" value="20" min="0">秒
          <input type="number" id="offsetMsInput" value="712" min="0" max="999">毫秒
        </div>
      </div>
    </div>

    <!-- 表格下方注释与蓝字提醒 -->
    <div class="note-section">
      <div><strong>使用方法：</strong>刷完第一排小怪后，将子女拉至怪物正中央，观察子女说话的一瞬间点击开启键，后续每次听到声音时按动赤壁即可。若声音晚于子女说话，则按子女说话为准。</div>
      <div class="blue-tip"><strong>提醒：</strong>提醒触发点和循环差值为两倍的个人反应时间，每个人的数值是不同的。</div>
    </div>

    <div class="status" id="status">点击“开启”开始定时</div>
    <div class="btn-group">
      <button id="startBtn">开启</button>
      <button id="stopBtn" disabled>停止</button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('status');
    
    const cycleSecInput = document.getElementById('cycleSecInput');
    const cycleMsInput = document.getElementById('cycleMsInput');
    const offsetSecInput = document.getElementById('offsetSecInput');
    const offsetMsInput = document.getElementById('offsetMsInput');

    let audioCtx = null;
    let animFrameId = null;
    let scheduleInterval = null; 
    let audioStartTime = 0; 
    let nextBeepIndex = 0;  

    let CYCLE_TIME = 21.112;    
    let BEEP_OFFSET = 20.712;   
    const ALERT_DURATION = 1.2; 
    const SCHEDULE_AHEAD = 3.0; 

    function scheduleBeep(targetAudioTime) {
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.value = 880; 

      gainNode.gain.setValueAtTime(0, targetAudioTime);
      gainNode.gain.setValueAtTime(0.3, targetAudioTime + 0.005);
      gainNode.gain.setValueAtTime(0, targetAudioTime + 0.5);
      gainNode.gain.setValueAtTime(0, targetAudioTime + 0.55);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start(targetAudioTime);
      oscillator.stop(targetAudioTime + 0.6);
    }

    function checkAudioSchedule() {
      if (!audioCtx) return;
      const elapsed = audioCtx.currentTime - audioStartTime;
      const nextBeepTime = (nextBeepIndex * CYCLE_TIME) + BEEP_OFFSET;
      
      if (elapsed + SCHEDULE_AHEAD >= nextBeepTime) {
        scheduleBeep(audioStartTime + nextBeepTime);
        nextBeepIndex++;
      }
    }

    function render() {
      if (!audioCtx) return;
      const elapsed = audioCtx.currentTime - audioStartTime;

      let remainingSeconds = BEEP_OFFSET - (elapsed % CYCLE_TIME);
      if (remainingSeconds < 0) remainingSeconds += CYCLE_TIME;

      const totalMs = Math.round(remainingSeconds * 1000);
      const secs = Math.floor(totalMs / 1000);
      const msecs = totalMs % 1000;
      
      const formattedMs = String(msecs).padStart(3, '0');
      statusText.innerText = `距离下一次提醒：${secs}秒 ${formattedMs}毫秒`;

      let timeSinceBeep = (elapsed - BEEP_OFFSET) % CYCLE_TIME;
      if (timeSinceBeep < 0) timeSinceBeep += CYCLE_TIME;

      if (elapsed >= BEEP_OFFSET && timeSinceBeep < ALERT_DURATION) {
        document.body.classList.add('alert');
      } else {
        document.body.classList.remove('alert');
      }

      animFrameId = requestAnimationFrame(render);
    }

    startBtn.addEventListener('click', () => {
      const cycleSec = parseInt(cycleSecInput.value) || 0;
      const cycleMs = parseInt(cycleMsInput.value) || 0;
      const totalCycleMs = (cycleSec * 1000) + cycleMs;

      const offsetSec = parseInt(offsetSecInput.value) || 0;
      const offsetMs = parseInt(offsetMsInput.value) || 0;
      const totalOffsetMs = (offsetSec * 1000) + offsetMs;

      CYCLE_TIME = totalCycleMs / 1000;
      BEEP_OFFSET = totalOffsetMs / 1000;
      
      if (BEEP_OFFSET >= CYCLE_TIME) {
        BEEP_OFFSET = Math.max(0, CYCLE_TIME - 0.2);
        const correctedTotalMs = Math.round(BEEP_OFFSET * 1000);
        offsetSecInput.value = Math.floor(correctedTotalMs / 1000);
        offsetMsInput.value = correctedTotalMs % 1000;
      }

      startBtn.disabled = true;
      stopBtn.disabled = false;
      cycleSecInput.disabled = true;
      cycleMsInput.disabled = true;
      offsetSecInput.disabled = true;
      offsetMsInput.disabled = true;
      
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      audioStartTime = audioCtx.currentTime;
      nextBeepIndex = 0;

      scheduleInterval = setInterval(checkAudioSchedule, 100);
      render();
    });

    stopBtn.addEventListener('click', () => {
      startBtn.disabled = false;
      stopBtn.disabled = true;
      cycleSecInput.disabled = false;
      cycleMsInput.disabled = false;
      offsetSecInput.disabled = false;
      offsetMsInput.disabled = false;

      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (scheduleInterval) clearInterval(scheduleInterval);

      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }

      document.body.classList.remove('alert');
      statusText.innerText = '循环已停止，可修改设置后重新开启';
    });
  </script>
</body>
</html>
